<svg width="100%" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1440"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#A78BFA"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background card so this looks right on white AND dark GitHub themes -->
  <rect x="0" y="0" width="1200" height="320" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="90" r="1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="60" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="150" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="260" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="270" r="1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbiting 3D cube (left) -->
  <g transform="translate(140,160)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/>
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#A78BFA" fill-opacity="0.18" stroke="#A78BFA" stroke-width="1.5"/>
      <polygon points="0,-40 35,-20 0,0 -35,-20" fill="#A78BFA" fill-opacity="0.35" stroke="#A78BFA" stroke-width="1"/>
      <polygon points="0,0 35,-20 35,20 0,40" fill="#7dd3fc" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="1"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="140,160; 140,148; 140,160" dur="4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- orbiting ring + node (right) -->
  <g transform="translate(1040,150)">
    <ellipse cx="0" cy="0" rx="70" ry="26" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="70" cy="0" r="6" fill="#A78BFA"/>
    </g>
    <circle cx="0" cy="0" r="18" fill="#A78BFA" fill-opacity="0.25" filter="url(#softBlur)"/>
    <circle cx="0" cy="0" r="9" fill="#A78BFA"/>
  </g>

  <!-- floating small cube bottom right -->
  <g transform="translate(1080,250)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="11s" repeatCount="indefinite"/>
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#7dd3fc" fill-opacity="0.3" stroke="#7dd3fc" stroke-width="1"/>
    </g>
  </g>

  <!-- name -->
  <text x="600" y="150" text-anchor="middle" font-family="Fira Code, monospace" font-size="46" font-weight="700" fill="url(#textGrad)">
    Abdul Rehman Bhatti
  </text>
  <text x="600" y="190" text-anchor="middle" font-family="Fira Code, monospace" font-size="17" fill="#c4b5fd">
    Agentic AI Engineer · Automation · Ethical Hacking
  </text>

  <!-- subtle scan line pulse -->
  <rect x="0" y="0" width="1200" height="2" fill="#A78BFA" opacity="0.5">
    <animate attributeName="y" values="0;318;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>

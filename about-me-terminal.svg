<svg width="800" height="440" viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#1a1440"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <radialGradient id="glowPurple" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="85%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b3a"/>
      <stop offset="100%" stop-color="#2a1f4d"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'Cascadia Code','Fira Code','Consolas',monospace; }
      .kw   { fill: #c792ea; }
      .fn   { fill: #82aaff; }
      .str  { fill: #c3e88d; }
      .prop { fill: #f78c6c; }
      .num  { fill: #f78c6c; }
      .cm   { fill: #6b7394; font-style: italic; }
      .punc { fill: #89ddff; }
      .plain{ fill: #d6deeb; }
      .var  { fill: #ffcb6b; }
    </style>
  </defs>

  <!-- outer glow border -->
  <rect x="4" y="4" width="792" height="432" rx="18" fill="url(#borderGlow)" opacity="0.55"/>

  <!-- card body -->
  <rect x="10" y="10" width="780" height="420" rx="15" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <rect x="10" y="10" width="780" height="420" rx="15" fill="url(#glowPurple)"/>
  <rect x="10" y="10" width="780" height="420" rx="15" fill="url(#glowBlue)"/>

  <!-- title bar -->
  <path d="M10 25 Q10 10 25 10 H775 Q790 10 790 25 V52 H10 Z" fill="url(#titleBar)"/>
  <circle cx="34" cy="31" r="6" fill="#ff5f56" filter="url(#dotGlow)"/>
  <circle cx="54" cy="31" r="6" fill="#ffbd2e" filter="url(#dotGlow)"/>
  <circle cx="74" cy="31" r="6" fill="#27c93f" filter="url(#dotGlow)"/>
  <text x="400" y="35" text-anchor="middle" class="mono" font-size="13" fill="#8b93b8">about-me.js</text>

  <!-- code content -->
  <g class="mono" font-size="16.5">
    <text x="34" y="90"><tspan class="kw">const</tspan><tspan class="plain"> </tspan><tspan class="var">developer</tspan><tspan class="punc"> = {</tspan></text>

    <text x="34" y="122"><tspan class="plain">  </tspan><tspan class="prop">name</tspan><tspan class="punc">: </tspan><tspan class="str">"Your Name"</tspan><tspan class="punc">,</tspan></text>

    <text x="34" y="150"><tspan class="plain">  </tspan><tspan class="prop">role</tspan><tspan class="punc">: </tspan><tspan class="str">"Full-Stack Developer"</tspan><tspan class="punc">,</tspan></text>

    <text x="34" y="178"><tspan class="plain">  </tspan><tspan class="prop">location</tspan><tspan class="punc">: </tspan><tspan class="str">"Lahore, Pakistan"</tspan><tspan class="punc">,</tspan></text>

    <text x="34" y="206"><tspan class="plain">  </tspan><tspan class="prop">stack</tspan><tspan class="punc">: [</tspan><tspan class="str">"JavaScript"</tspan><tspan class="punc">, </tspan><tspan class="str">"React"</tspan><tspan class="punc">, </tspan><tspan class="str">"Node.js"</tspan><tspan class="punc">, </tspan><tspan class="str">"Python"</tspan><tspan class="punc">],</tspan></text>

    <text x="34" y="234"><tspan class="plain">  </tspan><tspan class="prop">currentFocus</tspan><tspan class="punc">: </tspan><tspan class="str">"Building scalable web apps"</tspan><tspan class="punc">,</tspan></text>

    <text x="34" y="262"><tspan class="plain">  </tspan><tspan class="prop">funFact</tspan><tspan class="punc">: </tspan><tspan class="str">"I debug with console.log and pride"</tspan><tspan class="punc">,</tspan></text>

    <text x="34" y="290"><tspan class="plain">  </tspan><tspan class="prop">availableFor</tspan><tspan class="punc">: [</tspan><tspan class="str">"collabs"</tspan><tspan class="punc">, </tspan><tspan class="str">"freelance"</tspan><tspan class="punc">, </tspan><tspan class="str">"open-source"</tspan><tspan class="punc">]</tspan></text>

    <text x="34" y="318"><tspan class="punc">};</tspan></text>

    <text x="34" y="356"><tspan class="cm">// reach out — always happy to connect</tspan></text>

    <text x="34" y="384"><tspan class="fn">connect</tspan><tspan class="punc">(</tspan><tspan class="var">developer</tspan><tspan class="punc">);</tspan></text>
  </g>

  <!-- blinking cursor -->
  <rect x="230" y="371" width="10" height="18" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>

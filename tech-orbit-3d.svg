<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b21"/>
      <stop offset="100%" stop-color="#1a1440"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="280" rx="18" fill="url(#orbitBg)"/>

  <g transform="translate(600,140)">
    <circle r="46" fill="url(#coreGlow)"/>
    <circle r="20" fill="#A78BFA"/>
    <text x="0" y="6" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#0d0b21" font-weight="700">AI</text>

    <!-- orbit rings -->
    <ellipse rx="180" ry="60" fill="none" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="1"/>
    <ellipse rx="260" ry="95" fill="none" stroke="#A78BFA" stroke-opacity="0.2" stroke-width="1"/>

    <!-- orbit group 1: Python -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
      <g transform="translate(180,0)">
        <circle r="16" fill="#111827" stroke="#A78BFA" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="9" fill="#A78BFA">PY</text>
      </g>
    </g>

    <!-- orbit group 2: LLM -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="120 0 0" to="480 0 0" dur="10s" repeatCount="indefinite"/>
      <g transform="translate(180,0)">
        <circle r="16" fill="#111827" stroke="#7dd3fc" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#7dd3fc">LLM</text>
      </g>
    </g>

    <!-- orbit group 3: API -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="240 0 0" to="600 0 0" dur="10s" repeatCount="indefinite"/>
      <g transform="translate(180,0)">
        <circle r="16" fill="#111827" stroke="#f472b6" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#f472b6">API</text>
      </g>
    </g>

    <!-- outer orbit: Security -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="16s" repeatCount="indefinite"/>
      <g transform="translate(260,0)">
        <circle r="18" fill="#111827" stroke="#facc15" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#facc15">SEC</text>
      </g>
    </g>

    <!-- outer orbit: Automation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="-180 0 0" dur="16s" repeatCount="indefinite"/>
      <g transform="translate(260,0)">
        <circle r="18" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="Fira Code, monospace" font-size="8" fill="#34d399">AUTO</text>
      </g>
    </g>
  </g>

  <text x="600" y="255" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#c4b5fd">
    Agentic AI · Automation · Security — always in orbit
  </text>
</svg>
